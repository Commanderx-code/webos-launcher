<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TV Remote</title>
<style>
  :root {
    --bg: #0c0d10;
    --raised: #17191e;
    --key: #23262d;
    --key-down: #343842;
    --text: #f2f3f5;
    --muted: #8b909a;
    --accent: #f5b942;
    --danger: #e5484d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); max-width: 480px; margin: 0 auto; user-select: none; -webkit-user-select: none; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  #now { color: var(--muted); font-size: 14px; min-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; color: inherit; border: 0; background: var(--key); border-radius: 14px; cursor: pointer; touch-action: manipulation; }
  button:active, button.down { background: var(--key-down); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .power { width: 48px; height: 48px; border-radius: 50%; color: var(--danger); flex: none; display: grid; place-items: center; }
  .power svg { width: 24px; height: 24px; }
  .pad { position: relative; width: min(100%, 300px); aspect-ratio: 1; margin: 0 auto 20px; }
  .pad button { position: absolute; display: grid; place-items: center; font-size: 26px; }
  .pad .up { top: 0; left: 33%; width: 34%; height: 31%; border-radius: 22px 22px 10px 10px; }
  .pad .down { bottom: 0; left: 33%; width: 34%; height: 31%; border-radius: 10px 10px 22px 22px; }
  .pad .left { left: 0; top: 33%; width: 31%; height: 34%; border-radius: 22px 10px 10px 22px; }
  .pad .right { right: 0; top: 33%; width: 31%; height: 34%; border-radius: 10px 22px 22px 10px; }
  .pad .ok { left: 34%; top: 34%; width: 32%; height: 32%; border-radius: 50%; font-size: 18px; font-weight: 700; background: #2f333b; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  .row.four { grid-template-columns: repeat(4, 1fr); }
  .row button { height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 20px; }
  .row button small { font-size: 11px; color: var(--muted); }
  h2 { margin: 26px 0 10px; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; background: none; min-width: 0; }
  .app .tile { width: 100%; aspect-ratio: 16 / 10; border-radius: 12px; display: grid; place-items: center; background: var(--raised); overflow: hidden; }
  .app .tile img { max-width: 62%; max-height: 62%; }
  .app .tile .letter { font-size: 22px; font-weight: 700; }
  .app .name { font-size: 12px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app:active .tile { outline: 2px solid var(--text); }
  .type input { width: 100%; height: 52px; padding: 0 14px; margin-bottom: 10px; border: 0; border-radius: 14px; background: var(--raised); color: var(--text); font: inherit; font-size: 17px; user-select: text; -webkit-user-select: text; }
  .type input:focus { outline: 2px solid var(--accent); }
  .type .row button { font-size: 15px; }
  .row.two { grid-template-columns: repeat(2, 1fr); }
  .row button[hidden] { display: none; }
  .results { display: grid; gap: 8px; margin-top: 4px; }
  .result { display: flex; align-items: center; gap: 12px; padding: 8px; text-align: left; background: var(--raised); }
  .result img, .result .poster { width: 44px; height: 66px; border-radius: 6px; object-fit: cover; flex: none; background: var(--key); }
  .result b { display: block; font-weight: 600; }
  .result small { color: var(--muted); font-size: 13px; }
  .inputs { display: flex; flex-wrap: wrap; gap: 10px; }
  .inputs button { padding: 12px 16px; }
  #toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--raised); color: var(--text); padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div>
    <h1>TV Remote</h1>
    <div id="now"></div>
  </div>
  <button class="power" id="power" aria-label="Turn the TV off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg></button>
</header>

<div class="pad">
  <button class="up" data-button="UP" aria-label="Up">▲</button>
  <button class="left" data-button="LEFT" aria-label="Left">◀</button>
  <button class="ok" data-button="ENTER">OK</button>
  <button class="right" data-button="RIGHT" aria-label="Right">▶</button>
  <button class="down" data-button="DOWN" aria-label="Down">▼</button>
</div>

<div class="row">
  <button data-button="BACK">↩<small>Back</small></button>
  <button data-button="LAUNCHER">⌂<small>Home</small></button>
  <button data-button="LGHOME">☰<small>LG home</small></button>
</div>
<div class="row">
  <button data-button="VOLUMEDOWN" data-repeat>−<small>Volume</small></button>
  <button data-button="MUTE">🔇<small>Mute 2½ min</small></button>
  <button data-button="VOLUMEUP" data-repeat>+<small>Volume</small></button>
</div>
<div class="row four">
  <button data-button="REWIND" aria-label="Rewind">⏪</button>
  <button data-button="PLAY" aria-label="Play">▶&#xFE0E;</button>
  <button data-button="PAUSE" aria-label="Pause">⏸</button>
  <button data-button="FASTFORWARD" aria-label="Fast forward">⏩</button>
</div>

<h2>Type on the TV</h2>
<div class="type">
  <input id="text" type="text" maxlength="200" placeholder="Open a search box on the TV, then type" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Text to type on the TV">
  <div class="row two">
    <button id="clear">Clear</button>
    <button id="enter">Enter ⏎</button>
  </div>
  <div class="row two">
    <button id="youtube" hidden>Search YouTube</button>
    <button id="plex" hidden>Search Plex</button>
  </div>
  <div class="results" id="results"></div>
</div>
<h2 id="recent-title" hidden>Recently used</h2>
<div class="apps" id="recent"></div>
<h2>Apps</h2>
<div class="apps" id="apps"></div>
<h2>Inputs</h2>
<div class="inputs" id="inputs"></div>
<div id="toast"></div>

<script>
'use strict';
let state = { apps: [], inputs: [], recent: [], foreground: '' };

function toast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

// failed: what to say when the TV refuses, in place of its own error. Resolves with whether it
// worked.
function act(body, failed) {
  if (navigator.vibrate && !failed) navigator.vibrate(12);
  return fetch('/api/act', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then((r) => r.json())
    .then((r) => {
      if (!r.ok) toast(failed || "Didn't work: " + r.error);
      return !!r.ok;
    })
    .catch(() => {
      toast("Can't reach the TV");
      return false;
    });
}

// Buttons; volume repeats while held.
document.querySelectorAll('[data-button]').forEach((b) => {
  let timer = null;
  const stop = () => { clearInterval(timer); timer = null; b.classList.remove('down'); };
  b.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    b.classList.add('down');
    act({ button: b.dataset.button });
    if (b.hasAttribute('data-repeat')) timer = setInterval(() => act({ button: b.dataset.button }), 250);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, stop));
});

// Power off with one tap.
document.getElementById('power').addEventListener('click', () => {
  act({ button: 'POWER' }).then((ok) => { if (ok) toast('Turning off'); });
});
function tile(app) {
  const b = document.createElement('button');
  b.className = 'app';
  const t = document.createElement('div');
  t.className = 'tile';
  if (app.bgColor) t.style.background = app.bgColor;
  if (app.icon) {
    const img = document.createElement('img');
    img.src = app.icon;
    img.alt = '';
    t.appendChild(img);
  } else {
    const l = document.createElement('span');
    l.className = 'letter';
    l.textContent = app.title.charAt(0);
    t.appendChild(l);
  }
  const n = document.createElement('div');
  n.className = 'name';
  n.textContent = app.title;
  b.append(t, n);
  b.addEventListener('click', () => { act({ launch: app.id }); toast('Opening ' + app.title); });
  return b;
}

function render() {
  const byId = {};
  state.apps.forEach((a) => { byId[a.id] = a; });
  state.inputs.forEach((i) => { byId[i.id] = i; });
  const current = byId[state.foreground];
  document.getElementById('now').textContent = current ? 'On screen: ' + current.title : '';
  document.getElementById('youtube').hidden = !state.youtube;
  document.getElementById('plex').hidden = !state.plex;
  const recent = document.getElementById('recent');
  recent.replaceChildren(...state.recent.map((id) => byId[id]).filter(Boolean).map(tile));
  document.getElementById('recent-title').hidden = !recent.children.length;
  document.getElementById('apps').replaceChildren(...state.apps.map(tile));
  document.getElementById('inputs').replaceChildren(...state.inputs.map((i) => {
    const b = document.createElement('button');
    b.textContent = i.title;
    b.addEventListener('click', () => { act({ launch: i.id }); toast('Switching to ' + i.title); });
    return b;
  }));
}

function refresh() {
  fetch('/api/state').then((r) => r.json()).then((s) => { state = s; render(); }).catch(() => {});
}
refresh();
setInterval(refresh, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
