<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="backdrop"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
    <header class="topbar">
      <div class="weather" id="weather"></div>
      <div class="clock">
        <div class="clock-time" id="time"></div>
        <div class="clock-date" id="date"></div>
      </div>
    </header>
    <main id="scroller"></main>
    <footer class="hints" id="hints"></footer>
    <aside class="sidebar" id="sidebar" aria-hidden="true">
      <div class="sb-head"><span class="sb-back" id="sb-back">‹</span><span id="sb-title"></span></div>
      <div class="sb-list" id="sb-list"></div>
      <div class="sb-foot" id="sb-foot"></div>
    </aside>
    <div class="toast" id="toast"></div>
    <div class="saver" id="saver">
      <div class="saver-art"></div>
      <div class="saver-art"></div>
      <video class="saver-video" id="saver-video" muted playsinline></video>
      <div class="saver-info" id="saver-info">
        <div class="saver-time" id="saver-time"></div>
        <div class="saver-date" id="saver-date"></div>
        <div class="saver-weather" id="saver-weather"></div>
        <div class="saver-caption" id="saver-caption"></div>
      </div>
    </div>
  </div>

  <!-- Written by `npm run sync`; the launcher still starts without it. -->
  <script src="data/data.js"></script>
  <!-- The last layout backup from the TV, for a fresh install; written by `npm run sync`. -->
  <script src="data/layout.js"></script>
  <script src="luna.js"></script>
  <script src="plex.js"></script>
  <script src="weather.js"></script>
  <script src="scenes.js"></script>
  <script src="main.js"></script>
</body>
</html>
